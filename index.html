<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf1f3">
    <title>牛顿环实验仪器 3D 查看</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">NEWTON'S RINGS LAB</p>
        <h1>实验仪器 3D 查看</h1>
      </div>
      <p class="controls-note">拖动旋转 · 滚轮或双指缩放</p>
    </header>

    <main class="viewer-grid">
      <section class="model-panel" aria-labelledby="newton-title">
        <header class="panel-header">
          <div>
            <span class="panel-index">01</span>
            <h2 id="newton-title">牛顿环仪</h2>
          </div>
          <button type="button" class="icon-button" data-action="reset" data-viewer="newton" aria-label="重置牛顿环仪视角" title="重置视角">
            <span aria-hidden="true">↺</span>
          </button>
        </header>
        <div id="newton-viewer" class="model-viewport" aria-label="牛顿环仪三维模型">
          <div class="viewer-status" role="status">正在加载模型…</div>
        </div>
      </section>

      <section class="model-panel" aria-labelledby="microscope-title">
        <header class="panel-header">
          <div>
            <span class="panel-index">02</span>
            <h2 id="microscope-title">读数显微镜</h2>
          </div>
          <button type="button" class="icon-button" data-action="reset" data-viewer="microscope" aria-label="重置读数显微镜视角" title="重置视角">
            <span aria-hidden="true">↺</span>
          </button>
        </header>
        <div id="microscope-viewer" class="model-viewport" aria-label="读数显微镜三维模型">
          <div class="viewer-status" role="status">正在加载模型…</div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const showBootError = (detail) => {
          const message = detail || "三维功能启动失败";
          document.querySelectorAll(".viewer-status").forEach((status) => {
            status.hidden = false;
            status.classList.add("is-error");
            status.textContent = `三维功能启动失败：${message}`;
          });
        };
        window.addEventListener("error", (event) => {
          showBootError(event.error?.message || event.message);
        });
        window.addEventListener("unhandledrejection", (event) => {
          showBootError(event.reason?.message || String(event.reason || "未知错误"));
        });
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
